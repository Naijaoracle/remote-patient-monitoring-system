name: Node.js CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint, test & audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Telemedicine-Remote-Monitoring-System

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Telemedicine-Remote-Monitoring-System/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test
        env:
          ALLOW_DEMO_INSECURE_KEYS: "1"

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  hardhat:
    name: Hardhat smart-contract tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Telemedicine-Remote-Monitoring-System/smart-contracts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Telemedicine-Remote-Monitoring-System/smart-contracts/package-lock.json

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --omit=optional

      - name: Run Hardhat tests
        run: npx hardhat test

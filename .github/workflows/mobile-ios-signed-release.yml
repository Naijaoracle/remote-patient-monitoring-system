name: Mobile iOS Signed IPA

on:
  workflow_dispatch:

jobs:
  build-signed-ipa:
    name: Build Signed iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Telemedicine-Remote-Monitoring-System/rpm_flutter_client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Import Apple certificate and provisioning profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${IOS_CERTIFICATE_P12_BASE64}" ] || [ -z "${IOS_CERTIFICATE_PASSWORD}" ] || [ -z "${IOS_PROVISIONING_PROFILE_BASE64}" ] || [ -z "${IOS_KEYCHAIN_PASSWORD}" ]; then
            echo "Missing required iOS signing secrets." >&2
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/ios-signing-cert.p12"
          PP_PATH="$RUNNER_TEMP/ios-profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"

          echo -n "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Generate ExportOptions.plist
        env:
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER }}
        run: |
          set -euo pipefail

          PROFILE_FILE="$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision | head -n1)"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_FILE" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")

          METHOD="${IOS_EXPORT_METHOD:-ad-hoc}"
          if [ -z "${IOS_TEAM_ID:-}" ] || [ -z "${IOS_BUNDLE_IDENTIFIER:-}" ]; then
            echo "IOS_TEAM_ID and IOS_BUNDLE_IDENTIFIER secrets are required." >&2
            exit 1
          fi

          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_IDENTIFIER}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Collect signed IPA
        run: |
          mkdir -p build/ios-signed-dist
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' | head -n1)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA generated." >&2
            exit 1
          fi
          cp "$IPA_PATH" build/ios-signed-dist/rpm-ios-signed.ipa

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: Telemedicine-Remote-Monitoring-System/rpm_flutter_client/build/ios-signed-dist/rpm-ios-signed.ipa

      - name: Publish signed IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Telemedicine-Remote-Monitoring-System/rpm_flutter_client/build/ios-signed-dist/rpm-ios-signed.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

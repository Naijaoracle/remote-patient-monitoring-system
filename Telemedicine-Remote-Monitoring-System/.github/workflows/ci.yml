name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  app-quality:
    name: App Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Root Dependencies
        run: npm install

      - name: Lint and Static Checks
        run: npm run lint

      - name: Run JS Tests
        run: npm test

  contracts-hardhat:
    name: Contracts Hardhat Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json

      - name: Install Contract Dependencies
        run: npm ci

      - name: Run Hardhat Tests
        run: npm run test:hardhat

  security-baseline:
    name: Security Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json

      - name: Install Contract Dependencies
        run: npm ci --prefix smart-contracts

      - name: Run Security Baseline
        env:
          SECURITY_FAIL_ON_CRITICAL: "1"
          SECURITY_FAIL_ON_AUDIT_ERROR: "1"
        run: npm run security:baseline

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/security
